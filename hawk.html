<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1016">
<title>Hawk</title>
<!-- The admin's live ST Method alerts (5 Nov 2026). Admin only: hawk_signals is readable by st_is_admin() alone, so anyone else
     sees "Admin only". Each alert can be rated - Good call / Not my trade / Too early / Too late - with a note, so the rules
     (cloud/hawk/engine.py) can be tuned to Nestor's judgement. Opened from the alert's phone notification (hawk.html?id=...). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f4f5f8; --card:#fff; --ink:#141820; --mut:#646c7b; --line:#e0e3ea; --soft:#eef0f4;
  --acc:#1d5a86; --buy:#17785a; --sell:#b3383f; --warn:#9a6a12; --hl:rgba(29,90,134,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1016; --card:#151922; --ink:#e7eaf0; --mut:#8c94a4; --line:#252b37; --soft:#1b202a;
    --acc:#6fb0e0; --buy:#45c08f; --sell:#ef7378; --warn:#e0b25a; --hl:rgba(111,176,224,.12);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1016; --card:#151922; --ink:#e7eaf0; --mut:#8c94a4; --line:#252b37; --soft:#1b202a;
  --acc:#6fb0e0; --buy:#45c08f; --sell:#ef7378; --warn:#e0b25a; --hl:rgba(111,176,224,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:28px 16px 80px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:28px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:14px;margin:4px 0 0}
.tabs{display:flex;gap:6px}
.tabs button{font:500 13px "IBM Plex Sans",sans-serif;color:var(--mut);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:500 20px "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mut)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.day{font:500 12px "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:26px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px;scroll-margin-top:20px}
.card.focus{box-shadow:0 0 0 2px var(--acc);background:linear-gradient(var(--hl),var(--hl)),var(--card)}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--mut)}
.chip.buy{color:var(--buy);background:color-mix(in srgb,var(--buy) 13%,transparent)}
.chip.sell{color:var(--sell);background:color-mix(in srgb,var(--sell) 13%,transparent)}
.chip.setup{color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.time{margin-left:auto;font:13px "IBM Plex Mono",monospace;color:var(--mut)}
.card h2{font-size:16px;font-weight:600;margin:8px 0 2px}
.card p{margin:0;color:var(--ink)}
.rate{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.rate button{font:500 13px "IBM Plex Sans",sans-serif;background:var(--soft);color:var(--ink);border:1px solid transparent;border-radius:8px;padding:6px 10px;cursor:pointer}
.rate button:hover{border-color:var(--line)}
.rate button[aria-pressed="true"].good{background:color-mix(in srgb,var(--buy) 18%,transparent);border-color:var(--buy);color:var(--buy)}
.rate button[aria-pressed="true"].bad{background:color-mix(in srgb,var(--sell) 16%,transparent);border-color:var(--sell);color:var(--sell)}
.rate button[aria-pressed="true"].early,.rate button[aria-pressed="true"].late{background:color-mix(in srgb,var(--warn) 16%,transparent);border-color:var(--warn);color:var(--warn)}
textarea{width:100%;margin-top:8px;font:14px "IBM Plex Sans",sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;min-height:38px}
.saved{font-size:12px;color:var(--mut);margin-top:4px;min-height:18px}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.empty{color:var(--mut);margin-top:28px}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Hawk</h1><p class="sub">Your live setup alerts · EUR/USD · London 08:00–10:00 · only you see this</p></div>
    <div class="tabs" role="group" aria-label="Period">
      <button data-p="1" aria-pressed="true">Today</button><button data-p="7" aria-pressed="false">7 days</button><button data-p="90" aria-pressed="false">All</button>
    </div>
  </header>
  <div class="stats" id="stats" hidden></div>
  <div id="list"><p class="empty">Loading…</p></div>
</main>
<script src="vendor/supabase-js-2.118.0.min.js"></script>
<script>
(function () {
  var sb = window.supabase.createClient('https://figozyxoyobixadhqewr.supabase.co', 'sb_publishable_h-TrkkVzrGOkwX6LxMDsaQ_hE8540Nv');
  var focusId = new URLSearchParams(location.search).get('id');
  var period = focusId ? 7 : 1, rows = [];
  var RATE = [['good', 'Good call'], ['bad', 'Not my trade'], ['early', 'Too early'], ['late', 'Too late']];
  var KIND = { brief: 'Brief', sweep: 'Watch', pocket: 'Watch', initiation: 'Initiation', setup: 'Setup', done: 'Done' };
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ldn(iso, o) { return new Date(iso).toLocaleString('en-GB', Object.assign({ timeZone: 'Europe/London' }, o)); }

  function stats() {
    var el = $('#stats'), alerts = rows.filter(function (r) { return r.kind !== 'done' && r.kind !== 'brief'; });
    var rated = alerts.filter(function (r) { return r.feedback; }), good = rated.filter(function (r) { return r.feedback === 'good'; });
    var setups = alerts.filter(function (r) { return r.kind === 'setup'; });
    el.innerHTML = [[alerts.length, 'alerts'], [setups.length, 'setups'], [rated.length, 'rated'],
      [rated.length ? Math.round(100 * good.length / rated.length) + '%' : '–', 'good calls']]
      .map(function (s) { return '<div class="stat"><b>' + s[0] + '</b><span>' + s[1] + '</span></div>'; }).join('');
    el.hidden = false;
  }

  function render() {
    var list = $('#list');
    if (!rows.length) { list.innerHTML = '<p class="empty">No alerts in this period. The hawk watches weekdays from 07:45 to 10:05 London time.</p>'; $('#stats').hidden = true; return; }
    stats();
    var html = '', last = '';
    rows.forEach(function (r) {
      var d = ldn(r.created_at, { weekday: 'long', day: 'numeric', month: 'long' });
      if (d !== last) { html += '<div class="day">' + esc(d) + '</div>'; last = d; }
      var side = r.side === 1 ? '<span class="chip buy">Buy</span>' : r.side === -1 ? '<span class="chip sell">Sell</span>' : '';
      var rateable = r.kind !== 'done';
      html += '<article class="card' + (r.id === focusId ? ' focus' : '') + '" id="a-' + r.id + '">' +
        '<div class="top"><span class="chip' + (r.kind === 'setup' ? ' setup' : '') + '">' + esc(KIND[r.kind] || r.kind) + '</span>' + side +
        '<span class="time">' + esc(ldn(r.created_at, { hour: '2-digit', minute: '2-digit' })) + '</span></div>' +
        '<h2>' + esc(r.title) + '</h2><p>' + esc(r.body) + '</p>' +
        (rateable ? '<div class="rate">' + RATE.map(function (x) {
          return '<button class="' + x[0] + '" data-id="' + r.id + '" data-f="' + x[0] + '" aria-pressed="' + (r.feedback === x[0]) + '">' + x[1] + '</button>';
        }).join('') + '</div><textarea data-id="' + r.id + '" placeholder="What did you see? (optional)" rows="1">' + esc(r.note || '') + '</textarea><div class="saved" id="s-' + r.id + '"></div>' : '') +
        '</article>';
    });
    list.innerHTML = html;
    if (focusId) { var f = document.getElementById('a-' + focusId); if (f) f.scrollIntoView({ block: 'center' }); focusId = null; }
  }

  async function load() {
    var { data: s } = await sb.auth.getSession();
    if (!s || !s.session) { $('#list').innerHTML = '<p class="empty">Sign in to Session Terminal in this browser first, then open this page again.</p>'; return; }
    if (window.__hawkAdmin === undefined) { var a = await sb.rpc('st_is_admin'); window.__hawkAdmin = !a.error && a.data === true; }
    if (!window.__hawkAdmin) { $('#list').innerHTML = '<p class="empty">Admin only.</p>'; $('#stats').hidden = true; return; }
    var since = new Date(Date.now() - period * 86400000); if (period === 1) since.setHours(0, 0, 0, 0);
    var { data, error } = await sb.from('hawk_signals').select('id, created_at, kind, side, title, body, feedback, note')
      .gte('created_at', since.toISOString()).order('created_at', { ascending: false }).limit(500);
    if (error) { $('#list').innerHTML = '<p class="empty">Couldn\'t load the alerts: ' + esc(error.message) + '</p>'; return; }
    rows = data || [];
    render();
  }

  async function save(id, patch, label) {
    patch.feedback_at = new Date().toISOString();
    var { error } = await sb.from('hawk_signals').update(patch).eq('id', id);
    var el = document.getElementById('s-' + id);
    if (el) el.textContent = error ? 'Not saved: ' + error.message : label;
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('.tabs button');
    if (t) { period = +t.dataset.p; document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-pressed', b === t); }); load(); return; }
    var b = e.target.closest('.rate button');
    if (!b) return;
    var r = rows.find(function (x) { return x.id === b.dataset.id; }); if (!r) return;
    r.feedback = r.feedback === b.dataset.f ? null : b.dataset.f;
    b.parentNode.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x.dataset.f === r.feedback); });
    save(r.id, { feedback: r.feedback }, r.feedback ? 'Saved' : 'Cleared'); stats();
  });
  document.addEventListener('change', function (e) {
    if (e.target.tagName !== 'TEXTAREA') return;
    var r = rows.find(function (x) { return x.id === e.target.dataset.id; }); if (!r) return;
    r.note = e.target.value.trim(); save(r.id, { note: r.note || null }, 'Note saved');
  });
  if (focusId) document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.p === '7'); });
  load();
})();
</script>
</body>
</html>
