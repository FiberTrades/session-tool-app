<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Chart · Session Terminal</title>
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #121116; }</style>
</head>
<body>
<script>
// One chart of Practice Replay in a window of its own: the app window that opened it ("Open this chart in a new window")
// draws the chart in here. Opened any other way, it goes to the app.
document.addEventListener('DOMContentLoaded', function () {
  var o = null, P = null, m = /[?&]slot=(\d)/.exec(location.search);
  try { o = window.opener; P = o && o.__stPractice; } catch (e) {}
  if (!P || !P._satReady || !m) { location.replace('app.html'); return; }
  if (!P._satReady(window, +m[1])) return;
  // the app window closed or reloaded: this chart went with it
  setInterval(function () { var still = false; try { still = !o.closed && o.__stPractice === P; } catch (e) {} if (!still) window.close(); }, 2000);
});
</script>
</body>
</html>
