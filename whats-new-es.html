<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Novedades · Session Terminal</title>
<meta name="description" content="Lo último de Session Terminal." />
<meta name="robots" content="index, follow" />
<style>
  :root{
    --bg:#0c0c0c; --border:#1a1a1a; --text:#f5f5f5; --text-mid:#c0c0c0; --text-dim:#7d7d7d; --accent:#f472b6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text-mid);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
    padding:0 24px calc(72px + env(safe-area-inset-bottom,0px));
  }
  .wrap{max-width:680px; margin:0 auto;}
  header.top{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:calc(26px + env(safe-area-inset-top,0px)) 0 0; margin-bottom:96px;
  }
  .brand{
    font-family:'DM Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
    font-size:14px; letter-spacing:.18em; text-transform:uppercase; color:var(--text);
    font-weight:600; text-decoration:none;
  }
  .back{
    font-family:'DM Mono','SFMono-Regular',ui-monospace,monospace;
    font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--text-dim); text-decoration:none; transition:color .15s;
  }
  .back:hover,.brand:hover{color:var(--accent);}
  h1{color:var(--text); font-size:44px; line-height:1.05; margin:0 0 16px; font-weight:700; letter-spacing:-0.025em;}
  .eff{color:var(--text-dim); font-size:16px; margin:0 0 80px;}
  /* One update: a small date, then a few short lines with room around them. */
  .day{display:grid; grid-template-columns:140px 1fr; gap:28px; padding:40px 0; border-top:1px solid var(--border);}
  .day:first-child{border-top:none; padding-top:0;}
  .day time{
    font-family:'DM Mono','SFMono-Regular',ui-monospace,monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--text-dim); padding-top:5px; white-space:nowrap;
  }
  .day ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px;}
  .day li{color:var(--text); font-size:18px; line-height:1.4; font-weight:500; letter-spacing:-0.01em;}
  .state{color:var(--text-dim); font-size:15px;}
  a{color:var(--accent); text-decoration:none;}
  footer.foot{
    margin-top:96px; padding-top:28px; border-top:1px solid var(--border);
    color:var(--text-dim); font-size:13px; display:flex; flex-wrap:wrap; gap:6px 20px; align-items:center;
  }
  footer.foot a{color:var(--text-dim);}
  footer.foot a:hover{color:var(--accent);}
  @media (max-width:560px){
    header.top{margin-bottom:64px;}
    h1{font-size:34px;}
    .eff{margin-bottom:52px;}
    .day{grid-template-columns:1fr; gap:14px; padding:32px 0;}
    .day li{font-size:17px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="https://sessionterminal.com/">Session Terminal</a>
    <a class="back" href="https://sessionterminal.com/app.html">← Volver a la aplicación</a>
  </header>

  <h1>Novedades</h1>
  <p class="eff">Lo último de Session Terminal.</p>

  <div id="wn-list"><p class="state">Cargando…</p></div>
  <noscript><p class="state">Activa JavaScript para ver las novedades.</p></noscript>

  <footer class="foot">
    <span>© 2026 Session Terminal</span>
    <a href="/terms-es.html">Términos</a>
    <a href="/privacy-es.html">Política de Privacidad</a>
    <a href="/whats-new.html" id="wn-other">English</a>
    <a href="#" class="st-copy-mail" role="button">help@sessionterminal.com</a>
  </footer>
</div>
<script>
  /* The list lives in whats-new.json, which the app reads too (the dot on its logo, Settings > What's new). */
  (function(){
    var LANG = 'es', LOCALE = 'es-ES', ERR = '<p class="state">' + "La lista no se ha cargado. Recarga la página para intentarlo de nuevo." + '</p>';
    var box = document.getElementById('wn-list');
    function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function day(d){
      try{ return new Date(d + 'T12:00:00Z').toLocaleDateString(LOCALE, { day:'numeric', month:'short', year:'numeric', timeZone:'UTC' }); }
      catch(e){ return d; }
    }
    fetch('/whats-new.json', { cache:'no-store' }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(j){
      var h = '';
      (j.entries || []).forEach(function(e){
        var lines = e[LANG] || e.en || [];
        if(!lines.length) return;
        h += '<section class="day"><time datetime="' + esc(e.date) + '">' + esc(day(e.date)) + '</time><ul>'
          + lines.map(function(l){ return '<li>' + esc(l) + '</li>'; }).join('') + '</ul></section>';
      });
      box.innerHTML = h || ERR;
    }).catch(function(){ box.innerHTML = ERR; });
    /* The other language keeps where you came from, so its back link still knows the way. */
    var o = document.getElementById('wn-other');
    if(o && location.search) o.setAttribute('href', o.getAttribute('href') + location.search);
  })();
</script>
<script>
  // Force a genuine navigation each time (avoids bfcache + service-worker "works once" trap).
  document.addEventListener("DOMContentLoaded", function(){
    var links = document.querySelectorAll("a.brand, a.back");
    for (var i=0;i<links.length;i++){
      links[i].addEventListener("click", function(e){
        e.preventDefault();
        /* Back to wherever this was opened from. The landing marks its own links, and
           returning there costs 150KB instead of the whole app - which is the app you could
           see flash past on the way. Anything else, including the app's own footer link,
           goes to the root exactly as before. The cache-buster stays on both: the comment
           above records a bfcache and service-worker trap worth respecting. */
        /* The root is the landing now, and the app is app.html. So the two destinations
           swap round: someone who came from the landing goes back to the root, and everyone
           else - the app's own footer link, or a direct visit - goes to the app. */
        var fromLanding = /(^|[?&])from=landing(&|$)/.test(location.search);
        var dest = fromLanding ? "https://sessionterminal.com/" : "https://sessionterminal.com/app.html";
        window.location.href = dest + "?_=" + Date.now();
      });
    }
  });
</script>
<!-- st-copy-mail-handler -->
<script>
  // The support address is click-to-COPY, not a mailto:. A mailto hands the user off to whatever
  // mail client the OS decides to open - and on a desktop with no client configured, to nothing at
  // all. Copying works everywhere, and it matches what the landing page's contact link already did.
  (function(){
    var EMAIL = 'help@sessionterminal.com';
    function toast(msg){
      try{
        var d = document.createElement('div');
        d.textContent = msg;
        d.style.cssText = 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:2147483647;max-width:90vw;background:#141018;color:#e8e0ee;border:1px solid #2a2233;border-radius:10px;padding:12px 18px;font-family:monospace;font-size:13px;line-height:1.5;box-shadow:0 12px 40px rgba(0,0,0,.5);text-align:center;';
        document.body.appendChild(d);
        setTimeout(function(){ try{ d.remove(); }catch(_){} }, 4500);
      }catch(_){}
    }
    function copyMail(e){
      if (e && e.preventDefault) e.preventDefault();
      try{
        var t = document.createElement('textarea');
        t.value = EMAIL; t.style.position = 'fixed'; t.style.opacity = '0';
        document.body.appendChild(t); t.focus(); t.select();
        document.execCommand('copy'); document.body.removeChild(t);
      }catch(_){}
      // These pages carry a correct <html lang>, so it is the right language source here.
      var es = (document.documentElement.lang === 'es');
      toast(es ? ('Copiado: ' + EMAIL + ' \u2014 p\u00e9galo en tu app de correo.')
               : ('Copied: ' + EMAIL + ' \u2014 paste it into your mail app.'));
      return false;
    }
    document.addEventListener('DOMContentLoaded', function(){
      var els = document.querySelectorAll('a.st-copy-mail');
      for (var i = 0; i < els.length; i++) els[i].addEventListener('click', copyMail);
    });
  })();
</script>
</body>
</html>
